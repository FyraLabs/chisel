name: Publish

on:
  push:
    branches: ["fyra"]

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - uses: ko-build/setup-ko@v0.8
      - run: ko build --platform=linux/amd64,linux/arm64 --bare
